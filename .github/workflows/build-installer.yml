name: Build installers

# Push a tag to cut a release:  git tag v2.9.1 && git push origin v2.9.1
# The workflow builds the app once per platform, bundles portable runtimes,
# and attaches the Windows EXE installer plus macOS DMGs to a GitHub Release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to build (e.g. v2.9.1) - only for manual runs'
        required: false

permissions:
  contents: write

env:
  NODE_RUNTIME_VERSION: '24.19.0'  # portable Node.js LTS bundled into the installer

jobs:
  build-windows-installer:
    runs-on: windows-latest
    outputs:
      app_version: ${{ steps.version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and verify it matches package.json
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notlike 'v*') { $tag = "${{ inputs.tag_name }}" }
          if (-not $tag) { Write-Error 'No tag name available'; exit 1 }
          $version = $tag.TrimStart('v')
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          Write-Host "Tag: $tag -> version $version | package.json: $pkg"
          if ($version -ne $pkg) {
            Write-Error "Tag version ($version) does not match package.json version ($pkg). Bump the version first."
            exit 1
          }
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          echo "APP_VERSION=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client-next/package-lock.json

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci --prefix server
          npm ci --prefix client-next

      - name: Build client (production)
        shell: pwsh
        run: npm run build --prefix client-next

      - name: Download portable Node.js runtime
        shell: pwsh
        run: |
          $v = $env:NODE_RUNTIME_VERSION
          $url = "https://nodejs.org/dist/v$v/node-v$v-win-x64.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\node-runtime.zip"
          Expand-Archive "$env:TEMP\node-runtime.zip" -DestinationPath "$env:TEMP\node-runtime"
          New-Item -ItemType Directory -Path 'installer\runtime\nodejs' -Force | Out-Null
          Copy-Item -Recurse -Force "$env:TEMP\node-runtime\node-v$v-win-x64\*" 'installer\runtime\nodejs\'
          & 'installer\runtime\nodejs\node.exe' -v

      - name: Download portable MinGit runtime (latest release)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod -Uri 'https://api.github.com/repos/git-for-windows/git/releases/latest' -Headers @{ 'User-Agent' = 'opencode-studio-ci' }
          $asset = $rel.assets | Where-Object { $_.name -match '^MinGit-.*-64-bit\.zip$' } | Select-Object -First 1
          if (-not $asset) { Write-Error 'MinGit 64-bit asset not found in latest git-for-windows release'; exit 1 }
          Write-Host "Downloading $($asset.name) from $($rel.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "$env:TEMP\mingit.zip"
          New-Item -ItemType Directory -Path 'installer\runtime\mingit' -Force | Out-Null
          # NOTE: Expand-Archive cannot handle MinGit's zip (symlink entries);
          # bsdtar (tar.exe, present on Windows runners) handles it correctly.
          tar -xf "$env:TEMP\mingit.zip" -C 'installer\runtime\mingit'
          if ($LASTEXITCODE -ne 0) { Write-Error "tar extraction failed: $LASTEXITCODE"; exit $LASTEXITCODE }
          & '.\installer\runtime\mingit\cmd\git.exe' --version

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=$env:APP_VERSION" 'installer\opencode-studio.iss'
          if ($LASTEXITCODE -ne 0) { Write-Error "ISCC failed with $LASTEXITCODE"; exit $LASTEXITCODE }
          Get-Item installer\Output\OpenCodeStudio-Setup.exe | Select-Object Name, Length

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: installer/Output/OpenCodeStudio-Setup.exe
          if-no-files-found: error

  build-macos-dmg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
          - arch: x64
            runner: macos-13
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine version and verify it matches package.json
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" != v* ]]; then tag="${{ inputs.tag_name }}"; fi
          if [[ -z "$tag" ]]; then echo 'No tag name available'; exit 1; fi
          version="${tag#v}"
          pkg_version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json | head -n 1)"
          echo "Tag: $tag -> version $version | package.json: $pkg_version"
          if [[ "$version" != "$pkg_version" ]]; then
            echo "Tag version ($version) does not match package.json version ($pkg_version). Bump the version first."
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "APP_VERSION=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client-next/package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          npm ci --prefix server
          npm ci --prefix client-next

      - name: Build client (production)
        shell: bash
        run: npm run build --prefix client-next

      - name: Build macOS DMG
        shell: bash
        run: |
          chmod +x installer/macos/build-dmg.sh
          ./installer/macos/build-dmg.sh "$APP_VERSION" "${{ matrix.arch }}" "$NODE_RUNTIME_VERSION"

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            installer/Output-macos/OpenCodeStudio-macOS-${{ matrix.arch }}.dmg
            installer/Output-macos/OpenCodeStudio-macOS-${{ matrix.arch }}.dmg.sha256
          if-no-files-found: error

  release:
    needs: [build-windows-installer, build-macos-dmg]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release with installers
        uses: softprops/action-gh-release@v2
        with:
          name: OpenCode Studio v${{ needs.build-windows-installer.outputs.app_version }}
          generate_release_notes: true
          files: |
            release-artifacts/OpenCodeStudio-Setup.exe
            release-artifacts/OpenCodeStudio-macOS-*.dmg
            release-artifacts/OpenCodeStudio-macOS-*.dmg.sha256
